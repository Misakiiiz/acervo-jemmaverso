<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · JemmaVerso</title>
<link rel="icon" type="image/png" href="../assets/imagens/icon.png">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/extras.css">
<script src="../compartilhados/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{display:block;overflow-x:hidden}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;
  background:radial-gradient(60% 50% at 15% 10%,color-mix(in srgb,var(--accent) 28%,transparent),transparent),
             radial-gradient(55% 45% at 90% 90%,color-mix(in srgb,var(--accent2,var(--accent)) 24%,transparent),transparent),var(--bg)}
.auth-card{width:100%;max-width:400px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:22px;padding:32px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-logo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 18%,transparent);margin-bottom:14px}
.auth-card h1{font:600 1.6rem Cinzel,serif;letter-spacing:.04em}
.auth-sub{color:var(--muted);margin:6px 0 22px}
.auth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:.8rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:500 .95rem Poppins,sans-serif;cursor:pointer;transition:transform .15s,border-color .15s}
.auth-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.auth-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2,var(--accent)));color:var(--on-accent,#17101f);border:0;font-weight:600}
.auth-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;margin:18px 0}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-card input{width:100%;padding:.8rem 1rem;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.auth-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.auth-msg{min-height:1.4em;margin-top:12px;font-size:.85rem;color:var(--muted)}
.auth-msg.err{color:#ff8a8a}.auth-msg.ok{color:var(--ok)}
.auth-back{display:inline-block;margin-top:18px;color:var(--muted);font-size:.85rem;text-decoration:none}
.auth-back:hover{color:var(--accent)}
.auth-spark{position:absolute;color:var(--accent);opacity:.55;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.auth-spark{animation:none}}
</style>
</head>
<body>
<main class="auth-wrap">
  <span class="auth-spark" style="top:12%;left:14%">✦</span>
  <span class="auth-spark" style="top:70%;left:9%;animation-delay:1s">✧</span>
  <span class="auth-spark" style="top:20%;right:12%;animation-delay:.5s">✧</span>
  <span class="auth-spark" style="bottom:12%;right:18%;animation-delay:1.6s">✦</span>

  <section class="auth-card" aria-labelledby="t">
    <img class="auth-logo" src="../assets/imagens/icon.png" alt="">
    <h1 id="t">JemmaVerso</h1>
    <p class="auth-sub">Entre para guardar seus favoritos, notas e leituras em qualquer aparelho ✦</p>

    <button class="auth-btn primary" id="google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
      Entrar com Google
    </button>

    <div class="auth-or">ou</div>

    <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    <button class="auth-btn" id="magic" type="button">Receber link de acesso por e-mail</button>
    <p class="auth-msg" id="msg" role="status"></p>
    <a class="auth-back" href="../index.html">← Continuar sem login</a>
  </section>
</main>

<script>window.JV_NO_WIDGET = true;</script>
<script src="../compartilhados/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../compartilhados/supabase-sync.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), msg = (t, c) => { $("msg").textContent = t; $("msg").className = "auth-msg " + (c || ""); };
  const A = window.jvAuth;
  if (!A) { msg("Login indisponível: configure o Supabase em compartilhados/supabase-config.js.", "err"); $("google").disabled = $("magic").disabled = true; return; }
  const dest = A.SITE_ROOT + "perfil/perfil.html";
  A.ready.then(user => { if (user) location.replace(dest); });

  $("google").onclick = async () => {
    const { error } = await A.client.auth.signInWithOAuth({ provider: "google", options: { redirectTo: dest } });
    if (error) msg("Erro: " + error.message, "err");
  };
  $("magic").onclick = async () => {
    const email = $("email").value.trim();
    if (!email) return msg("Digite seu e-mail.", "err");
    msg("Enviando…");
    const { error } = await A.client.auth.signInWithOtp({ email, options: { emailRedirectTo: dest } });
    error ? msg("Erro: " + error.message, "err") : msg("Link enviado! Confira seu e-mail (e o spam) ✦", "ok");
  };
  $("email").addEventListener("keydown", e => { if (e.key === "Enter") $("magic").click(); });
})();
</script>
</body>
</html>
